# Retrieval settings for the Policy agent (Stage 4). Tuned on the dev retrieval set only.
# The precedent similarity threshold and bonus cap live in data/rules/rules.yaml, not here.
embedding_model: BAAI/bge-small-en-v1.5
query_prefix: "Represent this sentence for searching relevant passages: "
reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2

candidates: 12          # vector search depth before rerank
top_k: 5                # clauses kept after rerank, per query
min_relevance: 0.0      # drop reranked clauses scoring below this (0..1 sigmoid of the logit)
min_vector_similarity: 0.30   # drop candidates with cosine similarity below this
precedent_candidates: 5
