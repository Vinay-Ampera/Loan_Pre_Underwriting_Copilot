# LiteLLM routing for the pipeline. Verified live on 2026-10-31 (python -m app.services.llm_probe).
# Agents ask for a ROLE; code never hardcodes a provider model id. Keys come from Settings.
#
# Observed free-tier facts (re-run llm_probe before relying on them; they change):
#   gemini-3.6-flash        HTTP 200; occasional 503 "high demand" on Gemini 3.x models
#   openai/gpt-oss-20b Groq HTTP 200; header limits: 1000 requests/day, 8000 tokens/minute
#                           (tokens/minute is the tight one: keep KYC/Risk prompts small)
#   nemotron-3-ultra-550b   NVIDIA build: HTTP 200; about 40 requests/minute shared by all models
#   OpenRouter :free        20 requests/minute, 50 requests/day while < $10 credit purchased
#   Not usable: gemini-2.5-flash and 2.5-flash-lite (closed to new users), OpenRouter paid models.

providers:
  gemini_flash:
    model: gemini/gemini-3.6-flash
    key: gemini_api_key
  gemini_flash_lite:
    model: gemini/gemini-3.5-flash-lite
    key: gemini_api_key
  groq_gpt_oss_20b:
    model: groq/openai/gpt-oss-20b
    key: groq_api_key
  nvidia_gpt_oss_20b:
    model: nvidia_nim/openai/gpt-oss-20b
    key: nvidia_api_key
  nvidia_nemotron:
    model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
    key: nvidia_api_key
  openrouter_nemotron_free:
    model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    key: openrouter_api_key

# role -> primary provider, then ordered fallbacks (different provider first, to spread quota)
roles:
  supervisor:  {primary: gemini_flash,      fallbacks: [openrouter_nemotron_free, gemini_flash_lite]}
  extraction:  {primary: gemini_flash,      fallbacks: [openrouter_nemotron_free, gemini_flash_lite]}
  decision:    {primary: gemini_flash,      fallbacks: [openrouter_nemotron_free, gemini_flash_lite]}
  kyc:         {primary: groq_gpt_oss_20b,  fallbacks: [nvidia_gpt_oss_20b, openrouter_nemotron_free]}
  risk:        {primary: groq_gpt_oss_20b,  fallbacks: [nvidia_gpt_oss_20b, openrouter_nemotron_free]}
  policy:      {primary: nvidia_nemotron,   fallbacks: [openrouter_nemotron_free, gemini_flash_lite]}
  # judge must be a lighter model from a different family than the generator (TESTING.md)
  judge:       {primary: gemini_flash_lite, fallbacks: [nvidia_gpt_oss_20b]}

router:
  num_retries: 1
  timeout: 90
  cooldown_time: 30
