[alembic]
script_location = %(here)s/app/db
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

# The URL is injected from app.core.config in app/db/env.py; never put it here.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
