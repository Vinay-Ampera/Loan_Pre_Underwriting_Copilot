server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: loan-copilot-api
    static_configs:
      - targets: [localhost]
        labels:
          job: loan-copilot-api
          __path__: /var/log/loan-copilot/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
            case_id: case_id
            trace_id: trace_id
      - labels:
          level:
          event:
