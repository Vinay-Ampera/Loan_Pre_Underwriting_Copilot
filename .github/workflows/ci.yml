# Pull-request gate (TESTING.md section 6). No API keys are used: models are off, the Langfuse
# client is off, and the evaluation gate runs on code-side metrics. The model-judged suites
# (RAGAS, DeepEval) run locally before a release: python -m app.eval.judge.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      LLM_ENABLED: "false"
      LANGFUSE_ENABLED: "false"
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e . mypy pip-audit
      - name: Lint and types
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Synthetic data
        run: |
          python -m synthetic.generate --split all
          python -m synthetic.verify
          python -m synthetic.fixtures
      - name: Tests (unit, agents, security, API)
        run: pytest -q
      - name: Evaluation gate (dev split, code-side metrics)
        run: python -m app.eval.run --split dev
      # filelock 3.32.7 has 13 advisories fixed only in 4.x, but the newest litellm requires
      # filelock<4.0, so they cannot be installed together. filelock only locks local cache files
      # (Hugging Face, torch) and no request data reaches it. Drop these ignores when litellm
      # lifts the cap (docs/EDGE_CASES.md E-41).
      - name: Dependency audit
        run: |
          pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln CVE-2026-112940 \
            --ignore-vuln CVE-2026-112913 \
            --ignore-vuln CVE-2026-112907 \
            --ignore-vuln CVE-2026-112938 \
            --ignore-vuln CVE-2026-112936 \
            --ignore-vuln CVE-2026-112910 \
            --ignore-vuln CVE-2026-112909 \
            --ignore-vuln CVE-2026-112911 \
            --ignore-vuln CVE-2026-112939 \
            --ignore-vuln CVE-2026-112915 \
            --ignore-vuln CVE-2026-112935 \
            --ignore-vuln CVE-2026-112912 \
            --ignore-vuln CVE-2026-112908

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
